global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # node-exporter on the lab k3s node; replace the hostname with the
  # node's IP if mesh DNS does not resolve it from inside the container
  - job_name: node-exporter
    static_configs:
      - targets:
          - hedronite-devops-lab:9100
